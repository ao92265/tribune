<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 520 200"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="Tribune">
  <title>Tribune</title>
  <g transform="translate(40,40)">
    <polygon points="60,10 110,110 10,110"
             fill="none" stroke="#111111" stroke-width="7"
             stroke-linejoin="round"/>
    <circle cx="60"  cy="10"  r="11" fill="#111111"/>
    <circle cx="10"  cy="110" r="11" fill="#6b7280"/>
    <circle cx="110" cy="110" r="11" fill="#b91c1c"/>
  </g>
  <text x="200" y="100"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="58" font-weight="700"
        fill="#111111" letter-spacing="3"
        dominant-baseline="central">TRIBUNE</text>
</svg>
